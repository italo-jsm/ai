spring.application.name=ai

# PostgreSQL local (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:ai}
spring.datasource.username=${POSTGRES_USER:ai}
spring.datasource.password=${POSTGRES_PASSWORD:ai_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Ollama executado no host. Propriedades do Spring AI 2.x.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.model.chat=ollama
spring.ai.ollama.chat.model=gemma4:12b-mlx
spring.ai.ollama.init.pull-model-strategy=never

# Modelo dedicado a embeddings para o pgvector.
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE
