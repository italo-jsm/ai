spring.application.name=ai

# PostgreSQL local (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:ai}
spring.datasource.username=${POSTGRES_USER:ai}
spring.datasource.password=${POSTGRES_PASSWORD:ai_local}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.open-in-view=false

# Chat e extração de memórias na Groq, pelo adaptador compatível com OpenAI.
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=${GROQ_MODEL}
# Compatibilidade Spring AI 2.0.1: Groq rejeita reasoning_content no histórico.
app.groq.reasoning-history-filter-enabled=true

# Ollama local permanece responsável pelos embeddings.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=never

# Modelo dedicado a embeddings para o pgvector.
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Quantidade máxima de memórias recentes incluídas no contexto do chat.
app.memory.context-limit=20

# Estratégia usada para recuperar memórias no contexto do chat.
app.memory.retrieval-strategy=semantic

# Indexação assíncrona das novas memórias, após confirmar o salvamento SQL.
app.memory.indexing.enabled=true

# Busca Brave independente de IA. Chave opcional na inicialização.
app.brave-search.api-key=${BRAVE_API_KEY:}
app.brave-search.base-url=https://api.search.brave.com
app.brave-search.timeout=10s
