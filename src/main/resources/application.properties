spring.application.name=ai

# RabbitMQ existente no Docker (Compose do projeto gitops).
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USER:nous}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:nous123}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:nous}
spring.rabbitmq.listener.simple.prefetch=1
app.telegram.enabled=${TELEGRAM_CONSUMER_ENABLED:true}
app.telegram.queue=${TELEGRAM_QUEUE:telegram_updates}
app.telegram.bot-token=${TELEGRAM_BOT_TOKEN:}
app.telegram.base-url=https://api.telegram.org
app.telegram.timeout=10s

# PostgreSQL local (docker compose up -d)
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_PORT:5433}/${POSTGRES_DB:ai}
spring.datasource.username=${POSTGRES_USER:ai}
spring.datasource.password=${POSTGRES_PASSWORD:ai_local}
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.open-in-view=false

# Sem perfil explícito, execute o chat local sem credenciais de nuvem.
spring.profiles.default=ollama

# A aplicação usa apenas chat e embeddings; não inicialize APIs OpenAI extras.
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
spring.ai.model.image=none
spring.ai.model.moderation=none

# Ollama local ou remoto: endereço compartilhado pelo chat Ollama e embeddings.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.init.pull-model-strategy=never

# Modelo dedicado a embeddings para o pgvector.
spring.ai.model.embedding=ollama
spring.ai.ollama.embedding.model=nomic-embed-text
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=768
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Quantidade máxima de memórias recentes incluídas no contexto do chat.
app.memory.context-limit=20

# Estratégia usada para recuperar memórias no contexto do chat.
app.memory.retrieval-strategy=semantic

# Indexação assíncrona das novas memórias, após confirmar o salvamento SQL.
app.memory.indexing.enabled=true

# Busca Brave independente de IA. Chave opcional na inicialização.
app.brave-search.api-key=${BRAVE_API_KEY:}
app.brave-search.base-url=https://api.search.brave.com
app.brave-search.timeout=10s

# Cadastro Telegram: SMTP opcional na inicialização; necessário para novos cadastros.
spring.mail.host=${SMTP_HOST:}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.registration.mail-from=${REGISTRATION_MAIL_FROM:}

# OAuth por usuário para a integração Finance no Telegram
app.finance.oauth.enabled=${FINANCE_OAUTH_ENABLED:false}
app.finance.oauth.issuer=${FINANCE_OAUTH_ISSUER:https://auth.italomariano.dev.br/realms/finance}
app.finance.oauth.client-id=${FINANCE_OAUTH_CLIENT_ID:ai-finance}
app.finance.oauth.client-secret=${FINANCE_OAUTH_CLIENT_SECRET:}
app.finance.oauth.redirect-uri=${FINANCE_OAUTH_REDIRECT_URI:http://localhost:8080/login/oauth2/code/finance}
app.finance.oauth.encryption-key=${FINANCE_OAUTH_ENCRYPTION_KEY:}

# Diagnóstico HTTP do Finance. DEBUG inclui o corpo JSON das requisições.
logging.level.com.italo.ai.config.FinanceConfiguration=${FINANCE_HTTP_LOG_LEVEL:INFO}
