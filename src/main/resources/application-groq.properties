# Groq usa o adaptador OpenAI; credenciais só são exigidas neste perfil.
spring.ai.model.chat=openai
spring.ai.openai.base-url=https://api.groq.com/openai/v1
spring.ai.openai.api-key=${GROQ_API_KEY}
spring.ai.openai.chat.model=${GROQ_MODEL}
# Compatibilidade Spring AI 2.0.1 com histórico de modelos de raciocínio.
app.groq.reasoning-history-filter-enabled=true
